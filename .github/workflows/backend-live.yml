# Backend CI/CD for the LIVE site (http://13.234.161.181) - runs on pushes to `main` that change Backend/.
#   1. Check:  installs the packages, runs Django's checks, makes + applies migrations on a fresh MySQL 8.4, runs the tests
#   2. Deploy: only if step 1 passed -> runs "~/deploy.sh live backend" on the server over SSH
# The server's ~/deploy-gate.sh only lets this key run "<live|test> <backend|frontend>".
# Secrets (Settings > Secrets and variables > Actions): SSH_HOST, SSH_KEY, SSH_KNOWN_HOSTS
name: Backend (live)

on:
  push:
    branches: [main]
    paths: ['Backend/**', '.github/workflows/backend-live.yml']
  workflow_dispatch: # "Run workflow" button in the Actions tab (pick the main branch)

concurrency:
  group: backend-live
  cancel-in-progress: false

jobs:
  check:
    name: Check (Django + MySQL 8.4)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: bookhero
          MYSQL_USER: bookhero
          MYSQL_PASSWORD: ci-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: Backend
    env: # throwaway values for this check only, not the server's
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: 'False'
      DB_NAME: bookhero
      DB_USER: bookhero
      DB_PASSWORD: ci-pass
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # same as the server (Ubuntu 24.04)
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install system libraries for mysqlclient
        run: sudo apt-get update -q && sudo apt-get install -y -q libmysqlclient-dev pkg-config

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Make and apply migrations on a fresh database
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run the tests
        env: # root: the tests create and drop their own database (test_bookhero)
          DB_USER: root
          DB_PASSWORD: ci-root
        run: python manage.py test --noinput

  deploy:
    name: Deploy to live
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy backend on the server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 ubuntu@"$SSH_HOST" "live backend"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend -> live: ${{ job.status }}"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\` by ${{ github.actor }}"
            echo "- Site: http://13.234.161.181"
          } >> "$GITHUB_STEP_SUMMARY"
