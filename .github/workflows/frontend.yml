# Frontend CI/CD - runs only when something under Frontend/ changes.
#   1. Build:  installs the packages and builds the React app (fails here = nothing is deployed)
#   2. Deploy: only if the build passed -> main = live site, development = test site
# The server builds again with its own Frontend/.env (VITE_API_BASE_URL) and swaps the new build in.
# Secrets (Settings > Secrets and variables > Actions): SSH_HOST, SSH_KEY, SSH_KNOWN_HOSTS
name: Frontend

on:
  push:
    branches: [main, development]
    paths: ['Frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: frontend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (React + Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the server
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'live' || 'test' }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      TARGET: ${{ github.ref_name == 'main' && 'live' || 'test' }}
      SITE_URL: ${{ github.ref_name == 'main' && 'http://13.234.161.181' || 'http://13.234.161.181:8080' }}
    steps:
      - name: Deploy frontend on the server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 ubuntu@"$SSH_HOST" "$TARGET frontend"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Frontend -> $TARGET: ${{ job.status }}"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\` by ${{ github.actor }}"
            echo "- Site: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
